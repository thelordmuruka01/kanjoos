services:
  - type: web
    name: abhi66
    env: python
    plan: free

    buildCommand: "pip3 install --no-cache-dir --upgrade --requirement requirements.txt"
    startCommand: "bash start"

    envVars:
      - key: API_ID
        sync: false

      - key: API_HASH
        sync: false

      - key: BOT_TOKEN
        sync: false

      - key: MONGO_DB_URI
        sync: false

      - key: OWNER_ID
        sync: false

      - key: LOGGER_ID
        sync: false

      - key: STRING_SESSION
        sync: false

      - key: PYTHON_VERSION
        value: 3.11.4
     
      - key: PORT
        value: "10000"

